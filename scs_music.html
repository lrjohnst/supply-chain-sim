<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCS — Title Theme</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1318;
    color: #c8d4dc;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 32px;
  }
  .title {
    font-size: 11px;
    letter-spacing: .18em;
    color: #e8c84a;
    text-transform: uppercase;
  }
  .viz {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 80px;
    width: 320px;
  }
  .bar {
    flex: 1;
    background: #e8c84a;
    transition: height 0.05s;
    min-height: 2px;
    border-radius: 1px 1px 0 0;
  }
  .bar:nth-child(2n) { background: #4ab8e8; }
  .bar:nth-child(3n) { background: #4ae8a0; }
  .controls { display: flex; gap: 16px; }
  button {
    background: #161c24;
    border: 1px solid #2a3540;
    color: #c8d4dc;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 10px 24px;
    cursor: pointer;
    border-radius: 2px;
    transition: all .15s;
  }
  button:hover { border-color: #e8c84a; color: #e8c84a; }
  button.active { border-color: #4ae8a0; color: #4ae8a0; background: #0f1318; }
  .info {
    font-size: 9px;
    color: #5a7080;
    letter-spacing: .08em;
    text-align: center;
    line-height: 1.8;
  }
  .chaos-meter {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chaos-label {
    font-size: 9px;
    color: #5a7080;
    letter-spacing: .1em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .chaos-bar-bg {
    height: 3px;
    background: #161c24;
    border-radius: 2px;
    overflow: hidden;
  }
  .chaos-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ae8a0, #e8c84a, #e84a6a);
    border-radius: 2px;
    transition: width 0.1s;
    width: 0%;
  }
</style>
</head>
<body>

<div class="title">Lucas Johnston's Supply Chain Sim — Title Theme</div>

<div class="viz" id="viz">
  <div class="bar" id="b0"></div>
  <div class="bar" id="b1"></div>
  <div class="bar" id="b2"></div>
  <div class="bar" id="b3"></div>
  <div class="bar" id="b4"></div>
  <div class="bar" id="b5"></div>
  <div class="bar" id="b6"></div>
  <div class="bar" id="b7"></div>
  <div class="bar" id="b8"></div>
  <div class="bar" id="b9"></div>
  <div class="bar" id="b10"></div>
  <div class="bar" id="b11"></div>
  <div class="bar" id="b12"></div>
  <div class="bar" id="b13"></div>
  <div class="bar" id="b14"></div>
  <div class="bar" id="b15"></div>
</div>

<div class="chaos-meter">
  <div class="chaos-label">
    <span>Chaos Index</span>
    <span id="chaosVal">0%</span>
  </div>
  <div class="chaos-bar-bg">
    <div class="chaos-bar-fill" id="chaosFill"></div>
  </div>
</div>

<div class="controls">
  <button id="playBtn" onclick="toggle()">▶ Play</button>
</div>

<div class="info">
  BPM 174 · 4 voices · chaotic phase modulation<br>
  melody + bass + arp + percussion · seamless loop
</div>

<script>
let ctx = null;
let playing = false;
let scheduleAhead = 0.1;
let lookAhead = 25;
let nextNoteTime = 0;
let currentStep = 0;
let timerID = null;
let analyser = null;
let dataArray = null;
let animFrame = null;

// Chaos state — logistic map drives pitch deviation
let chaosX = 0.7;
const chaosR = 3.82; // near edge of chaos, not fully random
let chaosLevel = 0;

function logisticStep() {
  chaosX = chaosR * chaosX * (1 - chaosX);
  return chaosX;
}

// Musical constants
const BPM = 174;
const STEP = 60 / BPM / 4; // 16th note

// Note frequencies
const noteFreq = {
  'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61,
  'G3': 196.00, 'A3': 220.00, 'Bb3': 233.08, 'B3': 246.94,
  'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
  'G4': 392.00, 'A4': 440.00, 'Bb4': 466.16, 'B4': 493.88,
  'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46,
  'G5': 783.99, 'A5': 880.00, 'Bb5': 932.33,
  'C6': 1046.50, 'D6': 1174.66, 'E6': 1318.51,
  'REST': 0
};

// --- MELODY (32 steps) ---
// Strong tonal center on C, with chromatic intrusions and syncopation
const melody = [
  'C5','REST','E5','REST', 'G5','F5','E5','D5',
  'C5','E5','G5','REST',  'Bb5','REST','A5','G5',
  'F5','REST','E5','D5',  'C5','D5','E5','F5',
  'G5','REST','Bb5','A5', 'G5','E5','C5','REST'
];

// --- BASS (32 steps) ---
const bass = [
  'C3','REST','C3','REST', 'G3','REST','G3','REST',
  'F3','REST','F3','REST', 'Bb3','REST','G3','REST',
  'A3','REST','A3','REST', 'E3','REST','E3','REST',
  'G3','REST','G3','D3',   'C3','REST','C3','REST'
];

// --- ARPEGGIO (16 steps, loops twice) ---
// Chaotic: intervals shift based on chaos engine
const arpBase = [
  'C4','E4','G4','B4', 'D4','F4','A4','C5',
  'Bb3','D4','F4','A4', 'G3','B3','D4','G4'
];

// --- PERCUSSION (16 steps, loops) ---
// kick=1, snare=2, hihat=3, open hihat=4
const perc = [
  1,3,2,3, 1,3,2,3, 1,3,2,4, 1,3,2,3
];

// Extra chaotic fill pattern (triggers at chaos threshold)
const chaosFill = [
  1,3,1,3, 2,3,1,4, 1,2,3,1, 3,1,2,3
];

function createOscillator(freq, type, gainVal, time, duration, detune = 0) {
  if (!freq || freq === 0) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(analyser);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);
  if (detune) osc.detune.setValueAtTime(detune, time);
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(gainVal, time + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
  osc.start(time);
  osc.stop(time + duration + 0.01);
}

function playKick(time) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(analyser);
  osc.frequency.setValueAtTime(160, time);
  osc.frequency.exponentialRampToValueAtTime(40, time + 0.08);
  gain.gain.setValueAtTime(0.9, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  osc.start(time);
  osc.stop(time + 0.2);
}

function playSnare(time) {
  // Noise burst
  const bufferSize = ctx.sampleRate * 0.1;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 3000;
  filter.Q.value = 0.7;
  const gain = ctx.createGain();
  source.connect(filter);
  filter.connect(gain);
  gain.connect(analyser);
  gain.gain.setValueAtTime(0.4, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
  source.start(time);
  source.stop(time + 0.15);
}

function playHihat(time, open = false) {
  const bufferSize = ctx.sampleRate * (open ? 0.15 : 0.05);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 8000;
  const gain = ctx.createGain();
  source.connect(filter);
  filter.connect(gain);
  gain.connect(analyser);
  gain.gain.setValueAtTime(open ? 0.25 : 0.15, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + (open ? 0.15 : 0.04));
  source.start(time);
  source.stop(time + (open ? 0.2 : 0.08));
}

function scheduleNote(step, time) {
  const s32 = step % 32;
  const s16 = step % 16;
  const chaos = logisticStep();
  chaosLevel = chaos;

  // Chaos detune: maps logistic output to pitch wobble
  // At low chaos (x near 0.5) wobble is small
  // At high chaos (x near 0 or 1) wobble grows
  const chaosIntensity = Math.abs(chaos - 0.5) * 2; // 0 to 1
  const detune = (chaos - 0.5) * chaosIntensity * 80; // max ±40 cents at peak

  // MELODY
  const melNote = melody[s32];
  const melFreq = noteFreq[melNote] || 0;
  if (melFreq > 0) {
    // Square wave for classic 8-bit melody
    createOscillator(melFreq, 'square', 0.18, time, STEP * 0.85, detune * 0.3);
    // Slight detune second voice for thickness
    createOscillator(melFreq, 'square', 0.06, time, STEP * 0.85, detune * 0.3 + 7);
  }

  // BASS
  const bassNote = bass[s32];
  const bassFreq = noteFreq[bassNote] || 0;
  if (bassFreq > 0) {
    createOscillator(bassFreq, 'sawtooth', 0.22, time, STEP * 1.8, 0);
    // Sub octave pulse
    createOscillator(bassFreq / 2, 'square', 0.12, time, STEP * 1.8, 0);
  }

  // ARPEGGIO — chaos-modulated interval selection
  // At high chaos, arp jumps to unexpected notes
  let arpNote;
  if (chaosIntensity > 0.75 && s16 % 4 === 2) {
    // Chaos intrusion: pull from a different part of the pattern
    const chaosIdx = Math.floor(chaos * 16);
    arpNote = arpBase[chaosIdx];
  } else {
    arpNote = arpBase[s16];
  }
  const arpFreq = noteFreq[arpNote] || 0;
  if (arpFreq > 0) {
    createOscillator(arpFreq, 'square', 0.10, time, STEP * 0.4, detune * 0.5);
  }

  // PERCUSSION — chaos-modulated fills
  const percPattern = chaosIntensity > 0.82 ? chaosFill : perc;
  const p = percPattern[s16];
  if (p === 1) playKick(time);
  else if (p === 2) playSnare(time);
  else if (p === 3) playHihat(time, false);
  else if (p === 4) playHihat(time, true);

  // EXTRA CHAOS: occasional pitch-bent stab at high chaos
  if (chaosIntensity > 0.88 && s16 % 8 === 3) {
    const stabFreqs = [noteFreq['C5'], noteFreq['Bb4'], noteFreq['G4'], noteFreq['E5']];
    const stabF = stabFreqs[Math.floor(chaos * stabFreqs.length)];
    if (stabF) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(analyser);
      osc.type = 'square';
      osc.frequency.setValueAtTime(stabF * 1.5, time);
      osc.frequency.exponentialRampToValueAtTime(stabF, time + STEP * 0.3);
      gain.gain.setValueAtTime(0.08, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + STEP * 0.3);
      osc.start(time);
      osc.stop(time + STEP * 0.4);
    }
  }
}

function scheduler() {
  while (nextNoteTime < ctx.currentTime + scheduleAhead) {
    scheduleNote(currentStep, nextNoteTime);
    nextNoteTime += STEP;
    currentStep++;
    if (currentStep >= 32) currentStep = 0;
  }
  timerID = setTimeout(scheduler, lookAhead);
}

function animateViz() {
  if (!playing) return;
  analyser.getByteFrequencyData(dataArray);
  const bars = document.querySelectorAll('.bar');
  const step = Math.floor(dataArray.length / bars.length);
  bars.forEach((bar, i) => {
    const val = dataArray[i * step] || 0;
    bar.style.height = Math.max(2, (val / 255) * 78) + 'px';
  });

  // Update chaos meter
  const chaosIntensity = Math.abs(chaosLevel - 0.5) * 2;
  const pct = Math.round(chaosIntensity * 100);
  document.getElementById('chaosFill').style.width = pct + '%';
  document.getElementById('chaosVal').textContent = pct + '%';

  animFrame = requestAnimationFrame(animateViz);
}

function toggle() {
  if (!playing) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    analyser.connect(ctx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    nextNoteTime = ctx.currentTime + 0.05;
    currentStep = 0;
    chaosX = 0.7;
    playing = true;
    scheduler();
    animateViz();
    document.getElementById('playBtn').textContent = '⏸ Pause';
    document.getElementById('playBtn').classList.add('active');
  } else {
    clearTimeout(timerID);
    cancelAnimationFrame(animFrame);
    ctx.close();
    ctx = null;
    playing = false;
    document.getElementById('playBtn').textContent = '▶ Play';
    document.getElementById('playBtn').classList.remove('active');
    document.querySelectorAll('.bar').forEach(b => b.style.height = '2px');
    document.getElementById('chaosFill').style.width = '0%';
    document.getElementById('chaosVal').textContent = '0%';
  }
}
</script>
</body>
</html>
